name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SeatReservation.sln

      - name: Build
        run: dotnet build SeatReservation.sln -c Release --no-restore

      - name: Unit tests (logic layer)
        run: dotnet test tests/SeatReservation.UnitTests -c Release --no-build

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/SeatReservation.IntegrationTests -c Release --no-build --filter "Category!=Load"

      - name: Docker image
        run: docker build -t seatres-api:ci .
