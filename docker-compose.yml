services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: seatres
      POSTGRES_PASSWORD: seatres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatres -d seatres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
