services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: seatres
      POSTGRES_PASSWORD: seatres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatres -d seatres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=seatres;Username=seatres;Password=seatres
      # Local-only key; Render generates its own (render.yaml).
      Auth__SigningKey: local-dev-signing-key-change-me-0123456789abcdef
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
